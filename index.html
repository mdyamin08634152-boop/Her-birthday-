<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samia Khan Kajol ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --text-white: #ffffff;
    --accent-yellow: #fff700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    /* Energetic & Vibrant Animated Gradient */
    background: linear-gradient(-45deg, #ff1f71, #ff8c00, #9d00ff, #00d2ff);
    background-size: 400% 400%;
    animation: energyFlow 8s ease infinite;
    color: var(--text-white);
    font-family: 'Montserrat', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  @keyframes energyFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Overlay Shimmer */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.2) 0%, transparent 80%);
    z-index: -1;
  }

  main { width: 100%; max-width: 480px; padding: 20px; text-align: center; z-index: 2; }

  .title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.8rem, 10vw, 4.2rem);
    color: white;
    margin-bottom: 5px;
    text-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }

  .subtitle {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 30px;
    color: var(--accent-yellow);
  }

  .timer-card {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(15px);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 35px;
    padding: 40px 15px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }

  .label {
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 0.8rem;
    margin-bottom: 25px;
    font-weight: 600;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
  }

  .unit-num {
    font-size: clamp(2.5rem, 8vw, 3.5rem);
    font-weight: 800;
    color: white;
    display: block;
    line-height: 1;
  }

  .unit-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--accent-yellow);
    margin-top: 8px;
  }

  .footer-date {
    margin-top: 30px;
    font-weight: 700;
    font-size: 1.2rem;
    border-top: 2px solid rgba(255, 255, 255, 0.3);
    padding-top: 20px;
  }

  /* Floating Emojis: 👸🎈✨🎉🎊🎂 */
  .emoji {
    position: absolute;
    bottom: -60px;
    z-index: 1;
    pointer-events: none;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
    20% { opacity: 1; transform: translateY(-20vh) rotate(45deg) scale(1.3); }
    80% { opacity: 1; }
    100% { transform: translateY(-115vh) rotate(90deg) scale(0.7); opacity: 0; }
  }
</style>
</head>
<body>

<main>
  <h1 class="title">Samia Khan Kajol</h1>
  <p class="subtitle">Her Joyful Journey</p>
  
  <div class="timer-card">
    <p class="label">Time since birth</p>
    
    <div class="grid">
      <div><span class="unit-num" id="y">0</span><div class="unit-label">Years</div></div>
      <div><span class="unit-num" id="m">0</span><div class="unit-label">Months</div></div>
      <div><span class="unit-num" id="d">0</span><div class="unit-label">Days</div></div>
    </div>

    <div class="grid" style="margin-bottom: 0;">
      <div><span class="unit-num" id="h">00</span><div class="unit-label">Hours</div></div>
      <div><span class="unit-num" id="min">00</span><div class="unit-label">Mins</div></div>
      <div><span class="unit-num" id="sec">00</span><div class="unit-label">Secs</div></div>
    </div>

    <p class="footer-date">Born: June 1, 2008 👸</p>
  </div>
</main>

<script>
function updateTimer() {
  const birth = new Date('2008-06-01T00:00:00');
  const now = new Date();
  
  let y = now.getFullYear() - birth.getFullYear();
  let m = now.getMonth() - birth.getMonth();
  let d = now.getDate() - birth.getDate();

  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }

  const diff = now - birth;
  const hrs = Math.floor((diff / 3600000) % 24);
  const mins = Math.floor((diff / 60000) % 60);
  const secs = Math.floor((diff / 1000) % 60);

  document.getElementById('y').innerText = y;
  document.getElementById('m').innerText = m;
  document.getElementById('d').innerText = d;
  document.getElementById('h').innerText = String(hrs).padStart(2, '0');
  document.getElementById('min').innerText = String(mins).padStart(2, '0');
  document.getElementById('sec').innerText = String(secs).padStart(2, '0');
}

setInterval(updateTimer, 1000);
updateTimer();

const emojis = ['👸','🎈','✨','🎉','🎊','🎂'];
function spawnEmoji() {
  const e = document.createElement('div');
  e.className = 'emoji';
  e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
  e.style.left = Math.random() * 100 + 'vw';
  e.style.fontSize = (Math.random() * 30 + 25) + 'px';
  const duration = 4 + Math.random() * 3; 
  e.style.animationDuration = duration + 's';
  document.body.appendChild(e);
  setTimeout(() => e.remove(), duration * 1000);
}
setInterval(spawnEmoji, 400); 
</script>

</body>
</html>
