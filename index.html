<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samia Khan Kajol ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --card: rgba(15, 15, 15, 0.8);
    --rose: #b07070;
    --deep-rose: #8e444d;
    --text: #e0c2c5;
    --gold: #d4a574;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ── MOVIE BACKGROUND EFFECT ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: 
      linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
      url('https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=2000&auto=format&fit=crop'); 
    background-size: cover;
    background-position: center;
    z-index: -2;
    animation: moviePan 30s infinite alternate linear;
  }

  @keyframes moviePan {
    from { transform: scale(1.1) translateX(-2%); }
    to { transform: scale(1.2) translateX(2%); }
  }

  main { width: 100%; max-width: 480px; padding: 20px; text-align: center; z-index: 2; }

  .title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.8rem, 9vw, 4rem);
    color: var(--gold);
    margin-bottom: 5px;
    text-shadow: 0 0 20px rgba(212, 165, 116, 0.4);
  }

  .subtitle {
    font-size: 1.1rem;
    color: var(--rose);
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .timer-card {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(212, 165, 116, 0.15);
    border-radius: 28px;
    padding: 40px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
  }

  .label {
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 0.7rem;
    color: var(--rose);
    margin-bottom: 25px;
    opacity: 0.8;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
  }

  .unit-num {
    font-size: clamp(2.2rem, 7vw, 3rem);
    font-weight: 300;
    color: var(--deep-rose);
    line-height: 1;
  }

  .unit-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--gold);
    letter-spacing: 1.5px;
    margin-top: 5px;
  }

  .footer-date {
    margin-top: 30px;
    color: var(--gold);
    font-style: italic;
    font-size: 1rem;
    border-top: 1px solid rgba(212, 165, 116, 0.1);
    padding-top: 20px;
  }

  /* ── FLOATING EMOJIS ── */
  .emoji {
    position: absolute;
    bottom: -60px;
    opacity: 0;
    z-index: 1;
    pointer-events: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    15% { opacity: 0.8; }
    85% { opacity: 0.5; }
    100% { transform: translateY(-115vh) rotate(30deg); opacity: 0; }
  }
</style>
</head>
<body>

<main>
  <h1 class="title">Samia Khan Kajol</h1>
  <p class="subtitle">Her Journey Since Birth</p>
  
  <div class="timer-card">
    <p class="label">Time Spent on Earth</p>
    
    <div class="grid">
      <div><span class="unit-num" id="y">0</span><div class="unit-label">Years</div></div>
      <div><span class="unit-num" id="m">0</span><div class="unit-label">Months</div></div>
      <div><span class="unit-num" id="d">0</span><div class="unit-label">Days</div></div>
    </div>

    <div class="grid">
      <div><span class="unit-num" id="h">00</span><div class="unit-label">Hours</div></div>
      <div><span class="unit-num" id="min">00</span><div class="unit-label">Mins</div></div>
      <div><span class="unit-num" id="sec">00</span><div class="unit-label">Secs</div></div>
    </div>

    <p class="footer-date">Born: June 1, 2007 👸</p>
  </div>
</main>

<script>
function updateTimer() {
  const birth = new Date('2007-06-01T00:00:00');
  const now = new Date();
  
  let y = now.getFullYear() - birth.getFullYear();
  let m = now.getMonth() - birth.getMonth();
  let d = now.getDate() - birth.getDate();

  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }

  const diff = now - birth;
  const hrs = Math.floor((diff / 3600000) % 24);
  const mins = Math.floor((diff / 60000) % 60);
  const secs = Math.floor((diff / 1000) % 60);

  document.getElementById('y').innerText = y;
  document.getElementById('m').innerText = m;
  document.getElementById('d').innerText = d;
  document.getElementById('h').innerText = String(hrs).padStart(2, '0');
  document.getElementById('min').innerText = String(mins).padStart(2, '0');
  document.getElementById('sec').innerText = String(secs).padStart(2, '0');
}

setInterval(updateTimer, 1000);
updateTimer();

// ── FLOATING EMOJI LOGIC ──
const emojis = ['👸','🎈','✨','🎉','🎊','🎂'];
function spawnEmoji() {
  const e = document.createElement('div');
  e.className = 'emoji';
  e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
  e.style.left = Math.random() * 100 + 'vw';
  e.style.fontSize = (Math.random() * 25 + 20) + 'px';
  const duration = 6 + Math.random() * 8;
  e.style.animationDuration = duration + 's';
  document.body.appendChild(e);
  setTimeout(() => e.remove(), duration * 1000);
}

setInterval(spawnEmoji, 800);
</script>

</body>
</html>
