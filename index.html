<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifetime Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #b07070;
    --deep-rose: #8e444d;
    --cream: #121212;
    --text: #e0c2c5;
    --gold: #b38b5d;
  }

  html, body {
    width: 100%; min-height: 100vh;
    background: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── BACKGROUND ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse at 20% 20%, #3d2528 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, #2d1b1e 0%, transparent 60%),
      linear-gradient(160deg, #121212 0%, #1a1a1a 50%, #0d0d0d 100%);
  }

  main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 6rem;
    gap: 2.5rem;
  }

  .header { text-align: center; }
  .header-sub {
    font-size: 0.85rem; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--rose);
    margin-bottom: 0.5rem;
  }
  .header-title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    color: var(--deep-rose);
    line-height: 1.1;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }

  .divider {
    display: flex; align-items: center; gap: 1rem;
    width: 100%; max-width: 400px;
  }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--rose), transparent); }
  .divider-icon { color: var(--rose); font-size: 1.2rem; }

  /* ── TIMER CARD ── */
  .timer-card {
    background: rgba(30, 30, 30, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(176, 112, 112, 0.2);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    text-align: center;
    width: 100%; max-width: 480px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .timer-label {
    font-size: 0.8rem; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--rose);
    margin-bottom: 1.5rem;
  }
  .timer-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem; margin-bottom: 1.5rem;
  }
  .timer-unit { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .timer-num {
    font-size: clamp(2rem, 6vw, 3rem);
    color: var(--deep-rose);
    line-height: 1;
  }
  .timer-unit-label {
    font-size: 0.7rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--rose);
  }
  .timer-date {
    font-style: italic; font-size: 0.95rem;
    color: var(--gold); margin-top: 1rem;
  }

  /* ── FLOATING HEARTS ── */
  .floating-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .fheart {
    position: absolute; bottom: -40px;
    font-size: 1.2rem; opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.2; }
    100% { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
  }

  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 2rem;
    font-style: italic; color: var(--rose);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="floating-hearts" id="hearts"></div>

<main>
  <div class="header">
    <p class="header-sub">Since the beginning</p>
    <h1 class="header-title">My Lifetime Timer</h1>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-icon">✨</div>
    <div class="divider-line"></div>
  </div>

  <div class="timer-card">
    <p class="timer-label">Time Spent on Earth</p>
    <div class="timer-grid">
      <div class="timer-unit"><span class="timer-num" id="years">0</span><span class="timer-unit-label">Years</span></div>
      <div class="timer-unit"><span class="timer-num" id="months">0</span><span class="timer-unit-label">Months</span></div>
      <div class="timer-unit"><span class="timer-num" id="days">0</span><span class="timer-unit-label">Days</span></div>
    </div>
    <div class="timer-grid">
      <div class="timer-unit"><span class="timer-num" id="hours">00</span><span class="timer-unit-label">Hours</span></div>
      <div class="timer-unit"><span class="timer-num" id="minutes">00</span><span class="timer-unit-label">Mins</span></div>
      <div class="timer-unit"><span class="timer-num" id="seconds">00</span><span class="timer-unit-label">Secs</span></div>
    </div>
    <p class="timer-date">Born: June 1, 2007 ✨</p>
  </div>
</main>

<footer>Always moving forward 🌹</footer>

<script>
function updateTimer() {
  const birthDate = new Date('2007-06-01T00:00:00');
  const now = new Date();
  
  let y = now.getFullYear() - birthDate.getFullYear();
  let m = now.getMonth() - birthDate.getMonth();
  let d = now.getDate() - birthDate.getDate();

  if (d < 0) { m--; const prev = new Date(now.getFullYear(), now.getMonth(), 0); d += prev.getDate(); }
  if (m < 0) { y--; m += 12; }

  const totalMs = now - birthDate;
  const h = Math.floor((totalMs / 3600000) % 24);
  const min = Math.floor((totalMs / 60000) % 60);
  const sec = Math.floor((totalMs / 1000) % 60);

  document.getElementById('years').textContent = y;
  document.getElementById('months').textContent = m;
  document.getElementById('days').textContent = d;
  document.getElementById('hours').textContent = String(h).padStart(2, '0');
  document.getElementById('minutes').textContent = String(min).padStart(2, '0');
  document.getElementById('seconds').textContent = String(sec).padStart(2, '0');
}

setInterval(updateTimer, 1000);
updateTimer();

const symbols = ['✨','🌹','🩷','🌕'];
function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'fheart';
  h.textContent = symbols[Math.floor(Math.random()*symbols.length)];
  h.style.left = Math.random()*100 + 'vw';
  h.style.fontSize = (0.8 + Math.random()) + 'rem';
  const dur = 7 + Math.random()*10;
  h.style.animationDuration = dur + 's';
  document.getElementById('hearts').appendChild(h);
  setTimeout(() => h.remove(), dur * 1000);
}
setInterval(spawnHeart, 1000);
</script>
</body>
</html>
