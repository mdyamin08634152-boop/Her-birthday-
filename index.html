<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samia Khan Kajol ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #1a1a1a;
    --bg-bottom: #050505;
    --card: rgba(25, 25, 25, 0.8);
    --rose: #b07070;
    --deep-rose: #8e444d;
    --text: #e0c2c5;
    --gold: #d4a574;
  }

  /* RESET */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* NO IMAGE - JUST GRADIENT */
  body {
    background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  main { width: 100%; max-width: 480px; padding: 20px; text-align: center; z-index: 2; }

  .title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.5rem, 8vw, 3.8rem);
    color: var(--gold);
    margin-bottom: 5px;
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--rose);
    margin-bottom: 30px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .timer-card {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(212, 165, 116, 0.15);
    border-radius: 25px;
    padding: 40px 15px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }

  .label {
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 0.7rem;
    color: var(--rose);
    margin-bottom: 25px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .unit-num {
    font-size: clamp(2.2rem, 7vw, 2.8rem);
    color: var(--deep-rose);
    display: block;
  }

  .unit-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 5px;
  }

  .footer-date {
    margin-top: 25px;
    color: var(--gold);
    font-style: italic;
    border-top: 1px solid rgba(212, 165, 116, 0.1);
    padding-top: 20px;
  }

  /* FLOATING EMOJIS */
  .emoji {
    position: absolute;
    bottom: -50px;
    opacity: 0;
    z-index: 1;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    20% { opacity: 0.7; }
    80% { opacity: 0.4; }
    100% { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
  }
</style>
</head>
<body>

<main>
  <h1 class="title">Samia Khan Kajol</h1>
  <p class="subtitle">Her Journey Since Birth</p>
  
  <div class="timer-card">
    <p class="label">Time Spent on Earth</p>
    
    <div class="grid">
      <div><span class="unit-num" id="y">0</span><div class="unit-label">Years</div></div>
      <div><span class="unit-num" id="m">0</span><div class="unit-label">Months</div></div>
      <div><span class="unit-num" id="d">0</span><div class="unit-label">Days</div></div>
    </div>

    <div class="grid">
      <div><span class="unit-num" id="h">00</span><div class="unit-label">Hours</div></div>
      <div><span class="unit-num" id="min">00</span><div class="unit-label">Mins</div></div>
      <div><span class="unit-num" id="sec">00</span><div class="unit-label">Secs</div></div>
    </div>

    <p class="footer-date">Born: June 1, 2008 👸</p>
  </div>
</main>

<script>
function updateTimer() {
  // SET TO 2008
  const birth = new Date('2008-06-01T00:00:00');
  const now = new Date();
  
  let y = now.getFullYear() - birth.getFullYear();
  let m = now.getMonth() - birth.getMonth();
  let d = now.getDate() - birth.getDate();

  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }

  const diff = now - birth;
  const hrs = Math.floor((diff / 3600000) % 24);
  const mins = Math.floor((diff / 60000) % 60);
  const secs = Math.floor((diff / 1000) % 60);

  document.getElementById('y').innerText = y;
  document.getElementById('m').innerText = m;
  document.getElementById('d').innerText = d;
  document.getElementById('h').innerText = String(hrs).padStart(2, '0');
  document.getElementById('min').innerText = String(mins).padStart(2, '0');
  document.getElementById('sec').innerText = String(secs).padStart(2, '0');
}

setInterval(updateTimer, 1000);
updateTimer();

// EMOJIS: 👸🎈✨🎉🎊🎂
const emojis = ['👸','🎈','✨','🎉','🎊','🎂'];
function spawnEmoji() {
  const e = document.createElement('div');
  e.className = 'emoji';
  e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
  e.style.left = Math.random() * 100 + 'vw';
  e.style.fontSize = (Math.random() * 20 + 20) + 'px';
  const duration = 6 + Math.random() * 6;
  e.style.animationDuration = duration + 's';
  document.body.appendChild(e);
  setTimeout(() => e.remove(), duration * 1000);
}
setInterval(spawnEmoji, 800);
</script>

</body>
</html>
